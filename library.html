<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.siliconflow.cn; object-src 'none'">
  <meta name="description" content="CarbonNet 文献库 — 碳材料超级电容器三维导电网络文献的搜索、多维筛选、CSV 导出与分页浏览。">
  <title>文献库 — CarbonNet 碳网图谱</title>
  <link rel="icon" href="assets/favicon.svg?v=1" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css?v=1">
  <link rel="stylesheet" href="css/main.css?v=1">
  <link rel="stylesheet" href="css/pages.css?v=1">
  <script defer src="js/vendor/echarts.min.js?v=1"></script>
  <script defer src="js/common.js?v=4"></script>
  <script defer src="js/library.js?v=1"></script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <span class="logo">⬡</span>
        <span>CarbonNet</span><span class="brand-cn">碳网图谱</span>
      </a>
      <nav aria-label="主导航">
        <ul class="nav-links">
          <li><a href="index.html">首页</a></li>
          <li><a href="taxonomy.html">知识脉络</a></li>
          <li><a href="graph.html">知识关系图</a></li>
          <li><a href="library.html">文献库</a></li>
          <li><a href="stats.html">数据面板</a></li>
          <li><a href="ai.html">AI 助手</a></li>
          <li><a href="about.html">关于</a></li>
        </ul>
      </nav>
      <div class="nav-right">
        <button class="icon-btn theme-toggle" aria-label="切换主题">☾</button>
        <button class="icon-btn nav-toggle" aria-label="菜单">☰</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div class="page-head enter">
        <span class="eyebrow">LIBRARY</span>
        <h1>文献库</h1>
        <p class="lead">搜索与多维筛选碳材料超级电容器三维导电网络文献，支持 CSV 导出。
          点击行标题进入论文详情页。</p>
      </div>

      <!-- 筛选栏 -->
      <div class="filter-bar enter">
        <input type="search" class="ctrl" id="fQ" placeholder="搜索标题 / 作者 / 期刊 / 摘要…" aria-label="搜索">
        <select class="ctrl" id="fMat" aria-label="材料筛选"><option value="">全部材料</option></select>
        <select class="ctrl" id="fStr" aria-label="策略筛选"><option value="">全部策略</option></select>
        <select class="ctrl" id="fType" aria-label="类型筛选">
          <option value="">全部类型</option>
          <option value="article">article</option>
          <option value="review">review</option>
        </select>
        <select class="ctrl" id="fOA" aria-label="开放获取筛选">
          <option value="">全部 OA</option>
          <option value="gold">gold</option>
          <option value="green">green</option>
          <option value="hybrid">hybrid</option>
          <option value="bronze">bronze</option>
          <option value="closed">closed</option>
        </select>
        <select class="ctrl" id="fYear" aria-label="年份筛选"><option value="">全部年份</option></select>
        <select class="ctrl" id="fSort" aria-label="排序">
          <option value="cited">按被引 ↓</option>
          <option value="date">按发表日期 ↓</option>
          <option value="year">按年份 ↓</option>
          <option value="title">按标题 A-Z</option>
        </select>
        <div class="spacer"></div>
        <button class="btn btn-primary btn-sm" id="btnCsv">⬇ 导出 CSV</button>
      </div>

      <!-- 活动筛选 chips -->
      <div class="tag-cloud enter" id="activeFilters" style="margin-bottom:14px"></div>

      <!-- 结果计数 -->
      <div class="lib-head enter">
        <span class="lib-count" id="libCount">—</span>
      </div>

      <!-- 表格 -->
      <div class="table-wrap enter">
        <table class="papers" id="papersTable">
          <thead>
            <tr>
              <th data-sort="title">标题</th>
              <th data-sort="year" style="width:64px">年份</th>
              <th data-sort="venue">期刊</th>
              <th data-sort="type" style="width:90px">类型</th>
              <th data-sort="oa" style="width:70px">OA</th>
              <th data-sort="cited" style="width:80px">被引</th>
              <th>作者</th>
            </tr>
          </thead>
          <tbody id="papersBody"></tbody>
        </table>
        <div class="state-note" id="tableState" style="display:none"></div>
      </div>

      <!-- 分页 -->
      <div class="pager" id="pager"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>CarbonNet 碳网图谱 · 碳材料超级电容器三维导电网络文献知识站</span>
      <span class="footer-mono">数据 © OpenAlex (CC0) · 每周自动更新 · <a href="about.html">关于</a></span>
    </div>
  </footer>
</body>
</html>
