name: Update Data & Deploy

# CarbonNet：每周抓取 OpenAlex → 提交（fetch + rebase 后 push）→ 打包并部署 GitHub Pages
on:
  schedule:
    - cron: '0 2 * * 1'   # 每周一 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 第三方 action 全部钉定完整 commit SHA（供应链安全，防 tag 移动）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Fetch OpenAlex data
        run: node scripts/fetch-openalex.js
        env:
          # 仅注入请求头（User-Agent/mailto），脚本不会将其写入任何数据文件
          OPENALEX_MAILTO: ${{ secrets.CONTACT_EMAIL }}

      - name: Commit & push data update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "data unchanged — skip commit"
          else
            git commit -m "data: weekly OpenAlex refresh ($(date -u +%Y-%m-%d))"
            # 铁律：push 前先 fetch + rebase origin/main
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Prepare Pages payload
        run: |
          # 仅打包站点运行所需文件，scripts/README 等不进 Pages
          mkdir -p _site
          cp -r assets data _site/
          cp *.html .nojekyll robots.txt _site/

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
