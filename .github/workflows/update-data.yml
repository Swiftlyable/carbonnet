name: Update Data & Deploy

on:
  schedule:
    # 每周一 02:00 UTC 自动抓取 OpenAlex 最新文献
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch OpenAlex data
        run: node scripts/fetch-data.mjs
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

      - name: Commit & push data update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "DATA_UNCHANGED=1" >> "$GITHUB_ENV"
            echo "data unchanged — skip commit"
          else
            git commit -m "data: weekly OpenAlex update ($(date -u +%Y-%m-%d))"
            # 铁律：push 前先 fetch + rebase origin/main，避免冲突
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
